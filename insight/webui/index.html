<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InSight — Insider Transactions</title>
<link rel="icon" type="image/png" href="/icon.png" />
<script id="theme-boot">
  // Runs before the stylesheet paints anything, so a non-default theme doesn't
  // flash the dark palette first. The server copy is authoritative and is
  // reconciled once the app loads; this is only the cached last-known value.
  //
  // It has to resolve "follow my system" itself rather than replaying a cached
  // result: the OS may have switched to dark since the app was last open, and
  // caching the resolved theme would then paint the wrong one for a frame.
  try {
    var cfg = JSON.parse(localStorage.getItem("insight.theme.cfg") || "null");
    var t = cfg && cfg.auto
      ? (matchMedia("(prefers-color-scheme: dark)").matches ? cfg.auto_dark : cfg.auto_light)
      : (cfg && cfg.theme);
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* private mode — fall back to the :root default */ }
</script>
<style>
  /* ---- themes -----------------------------------------------------------
     Every colour in the app comes from one of these variables, so a theme is
     purely a re-declaration of the same set — nothing else in the stylesheet
     needs to know which one is active. A theme MUST define all of them: a
     missing variable silently falls back to the :root (Dark) value, which is
     how a light theme ends up with one unreadable dark patch. tests/webui
     asserts every theme declares the full set.

     --*-dim are the tinted backgrounds behind badges; --accent-ink is the text
     that sits ON an accent-filled button, so it has to contrast with --accent
     rather than with --bg. */
  :root, [data-theme="dark"] {
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a323d;
    --text:#e6edf3; --muted:#8b949e;
    --accent:#58a6ff; --accent-ink:#06121f; --accent-dim:#1b2733;
    --buy:#3fb950; --sell:#f85149;
    --inst:#d29922; --inst-dim:#33290e;
    --buyback:#a371f7; --buyback-dim:#2a1e3d;
    --hover:#243041; --shadow:rgba(0,0,0,.5);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  /* Daytime reading. GitHub's light palette — already tuned for contrast. */
  [data-theme="light"] {
    --bg:#ffffff; --panel:#f6f8fa; --panel2:#eaeef2; --line:#d0d7de;
    --text:#1f2328; --muted:#59636e;
    --accent:#0969da; --accent-ink:#ffffff; --accent-dim:#ddf4ff;
    --buy:#1a7f37; --sell:#cf222e;
    --inst:#7d4e00; --inst-dim:#fff8c5;
    --buyback:#8250df; --buyback-dim:#fbefff;
    --hover:#eaeef2; --shadow:rgba(31,35,40,.15);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  /* Trading-desk phosphor: amber on near-black, monospaced like a real
     terminal. The only theme that changes the typeface. */
  [data-theme="terminal"] {
    --bg:#05080a; --panel:#0a1014; --panel2:#0f181d; --line:#1b2a30;
    --text:#cdf5d8; --muted:#6f9c7d;
    --accent:#ffb000; --accent-ink:#05080a; --accent-dim:#2a1f00;
    --buy:#00e676; --sell:#ff5252;
    --inst:#ffb000; --inst-dim:#2a1f00;
    --buyback:#b388ff; --buyback-dim:#1f1630;
    --hover:#12202a; --shadow:rgba(0,0,0,.7);
    --font:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  /* The financial press: salmon paper, teal ink. For long reading sessions. */
  [data-theme="newsprint"] {
    --bg:#fff1e5; --panel:#fff8f2; --panel2:#f7e3d3; --line:#e0cdbb;
    --text:#33302e; --muted:#6b625c;
    --accent:#0d7680; --accent-ink:#ffffff; --accent-dim:#d9eced;
    --buy:#1a7f4b; --sell:#cc2b2b;
    --inst:#96690b; --inst-dim:#f5e6c8;
    --buyback:#7a4fa3; --buyback-dim:#ece2f5;
    --hover:#f7e3d3; --shadow:rgba(51,48,46,.18);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  /* Softer than Dark — navy rather than black, for late sessions. */
  [data-theme="midnight"] {
    --bg:#0b1220; --panel:#121c2e; --panel2:#1a2740; --line:#26364f;
    --text:#e3e9f2; --muted:#8896ad;
    --accent:#7aa2f7; --accent-ink:#0b1220; --accent-dim:#1c2942;
    --buy:#9ece6a; --sell:#f7768e;
    --inst:#e0af68; --inst-dim:#2e2716;
    --buyback:#bb9af7; --buyback-dim:#2a2140;
    --hover:#1e2b45; --shadow:rgba(0,0,0,.55);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  /* 🍁 White and flag red. Sell keeps a deeper crimson so it stays distinct
     from the red used for links and the active tab. */
  [data-theme="canadian"] {
    --bg:#ffffff; --panel:#fff6f6; --panel2:#ffeaea; --line:#f2cccc;
    --text:#24110f; --muted:#7d5b5b;
    --accent:#d80621; --accent-ink:#ffffff; --accent-dim:#ffe3e6;
    --buy:#0b6e4f; --sell:#a4161a;
    --inst:#8a5a00; --inst-dim:#fff3cd;
    --buyback:#7b3fa0; --buyback-dim:#f2e6f7;
    --hover:#ffeaea; --shadow:rgba(216,6,33,.15);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  /* Espresso and caramel — a warm dark, for people who find blue-greys cold. */
  [data-theme="caramel"] {
    --bg:#1b1310; --panel:#241a15; --panel2:#30231b; --line:#453325;
    --text:#f2e5d7; --muted:#a89080;
    --accent:#e0a465; --accent-ink:#1b1310; --accent-dim:#3b2a1a;
    --buy:#8cbf6a; --sell:#ef6f5a;
    --inst:#d9a441; --inst-dim:#3a2e14;
    --buyback:#c39ad6; --buyback-dim:#33253a;
    --hover:#33251c; --shadow:rgba(0,0,0,.6);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  /* Soft sage paper with a deep teal-green accent. The accent is deliberately
     teal rather than grass, so it never reads as a "buy". */
  [data-theme="sage"] {
    --bg:#f2f7f0; --panel:#eaf2e6; --panel2:#dde9d8; --line:#c5d6bd;
    --text:#1f2a1c; --muted:#5b6b56;
    --accent:#1f6f5c; --accent-ink:#ffffff; --accent-dim:#d6ecdc;
    /* a mid green only reaches 3.2:1 on sage paper — this is the darkest that
       still reads as "green" while clearing WCAG AA */
    --buy:#1a7f37; --sell:#c62828;
    --inst:#8a6100; --inst-dim:#f7ecc9;
    --buyback:#6b4fa0; --buyback-dim:#ebe3f7;
    --hover:#dde9d8; --shadow:rgba(31,42,28,.14);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  /* Lemon zest, cut with teal so the accent doesn't disappear into the paper. */
  [data-theme="lemon"] {
    --bg:#fffce6; --panel:#fff8cc; --panel2:#fdf2ab; --line:#e8d97a;
    --text:#2b2a12; --muted:#6b6636;
    --accent:#0f766e; --accent-ink:#ffffff; --accent-dim:#cfeae7;
    --buy:#1a7f37; --sell:#c62828;
    --inst:#8a5a00; --inst-dim:#f6e59a;
    --buyback:#7b3fa0; --buyback-dim:#f0e4f7;
    --hover:#fdf2ab; --shadow:rgba(43,42,18,.15);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  /* Charcoal and champagne — understated, low-contrast chrome so the numbers
     carry the page. */
  [data-theme="chic"] {
    --bg:#131113; --panel:#1b181b; --panel2:#252125; --line:#353035;
    --text:#ede9ec; --muted:#9c9299;
    --accent:#c9a86a; --accent-ink:#131113; --accent-dim:#302818;
    --buy:#8fbf8a; --sell:#e0736f;
    --inst:#b98b3c; --inst-dim:#2e2716;
    --buyback:#b79ad6; --buyback-dim:#2b2338;
    --hover:#262127; --shadow:rgba(0,0,0,.6);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font:14px/1.45 var(--font);
    display:flex; flex-direction:column; height:100vh;
  }
  header {
    padding:14px 20px; border-bottom:1px solid var(--line);
    background:var(--panel); flex:0 0 auto;
  }
  .titlerow { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; letter-spacing:.5px; }
  .meta { color:var(--muted); font-size:12px; }
  .refresh-btn { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:5px 12px; font-size:12px; cursor:pointer; }
  .refresh-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .refresh-btn:disabled { opacity:.6; cursor:progress; }
  .refresh-btn.spin { animation:none; }
  .disc { color:var(--muted); font-size:12px; display:inline-flex; align-items:center;
    gap:5px; cursor:pointer; user-select:none; }
  .disc input { cursor:pointer; }
  .tabs { display:flex; gap:4px; margin-top:12px; border-bottom:1px solid var(--line); }
  .tabs button {
    background:transparent; color:var(--muted); border:0; border-bottom:2px solid transparent;
    padding:8px 16px; font-size:14px; cursor:pointer; margin-bottom:-1px;
  }
  .tabs button:hover { color:var(--text); }
  .tabs button[data-view].active { color:var(--text); border-bottom-color:var(--accent); }
  .back-btn { margin-left:auto; align-self:center; margin-bottom:4px;
    border:1px solid var(--line) !important; border-radius:7px; padding:4px 12px !important;
    font-size:12px !important; color:var(--muted); }
  .back-btn:hover:not(:disabled) { border-color:var(--accent) !important; color:var(--accent); }
  .back-btn:disabled { opacity:.35; cursor:default; }
  .stats { display:flex; gap:18px; margin-top:12px; flex-wrap:wrap; }
  .stat b { color:var(--text); font-size:16px; }
  .stat span { color:var(--muted); font-size:12px; margin-left:4px; }
  .controls { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  input[type=search] {
    flex:1 1 240px; min-width:180px; background:var(--bg); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:13px;
  }
  input[type=search]:focus { outline:none; border-color:var(--accent); }
  .seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button {
    background:var(--bg); color:var(--muted); border:0; padding:8px 14px;
    cursor:pointer; font-size:13px; border-right:1px solid var(--line);
  }
  .seg button:last-child { border-right:0; }
  .seg button.active { background:var(--panel2); color:var(--text); }
  select#range { background:var(--bg); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer; }
  select#range:focus { outline:none; border-color:var(--accent); }
  main { flex:1 1 auto; overflow-y:auto; padding:18px 20px 60px; }
  .company { margin-bottom:26px; }
  .company-head {
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    padding:6px 0 10px; border-bottom:1px solid var(--line); margin-bottom:14px;
    position:sticky; top:-18px; background:var(--bg); z-index:2;
  }
  .company-head .name { font-size:16px; font-weight:600; }
  .ticker { font-size:12px; color:var(--accent); background:var(--panel2);
    border:1px solid var(--line); border-radius:6px; padding:1px 7px; }
  .company-head .sub { color:var(--muted); font-size:12px; }
  .pill-warn { color:var(--inst); border:1px solid var(--inst); border-radius:6px;
    font-size:11px; padding:1px 6px; }
  .del-co { margin-left:auto; background:transparent; color:var(--muted);
    border:1px solid var(--line); border-radius:6px; padding:2px 9px;
    font-size:12px; line-height:1.4; cursor:pointer; }
  .del-co:hover { border-color:var(--sell); color:var(--sell); }
  .bell { background:transparent; border:1px solid var(--line); border-radius:6px;
    padding:2px 8px; font-size:12px; line-height:1.4; cursor:pointer; filter:grayscale(1) opacity(.6); }
  .bell:hover { border-color:var(--accent); filter:none; }
  .bell.on { border-color:var(--inst); filter:none; background:var(--inst-dim); }
  .sedi-link { background:transparent; color:var(--muted); border:1px solid var(--line);
    border-radius:6px; padding:2px 8px; font-size:12px; line-height:1.4; cursor:pointer;
    text-decoration:none; margin-left:6px; }
  .sedi-link:hover { border-color:var(--accent); color:var(--accent); }
  .company-head .bell { margin-left:6px; }
  .company-head .del-co { margin-left:8px; }
  /* cross-links between the Companies and Insiders tabs */
  .xnav { background:none; border:0; padding:0; font:inherit; color:inherit;
    cursor:pointer; text-align:left; border-bottom:1px dotted var(--line); }
  .xnav:hover { color:var(--accent); border-bottom-color:var(--accent); }
  .xnav-co { display:block; width:100%; border-bottom:0; }
  .xnav-co:hover .nm { color:var(--accent); }
  /* per-company notes */
  .note-btn { background:transparent; border:1px solid var(--line); border-radius:6px;
    padding:2px 8px; font-size:12px; line-height:1.4; cursor:pointer; margin-left:6px;
    filter:grayscale(1) opacity(.6); }
  .note-btn:hover { border-color:var(--accent); filter:none; }
  .note-btn.on { border-color:var(--accent); filter:none; background:var(--panel2); }
  .note-bar { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:10px; padding:8px 12px; margin-bottom:12px; }
  .note-bar.editing { border-left-color:var(--accent); }
  .note-view { margin:0; padding-left:18px; font-size:13px; line-height:1.55; }
  .note-view li { margin:1px 0; }
  .note-ta { width:100%; box-sizing:border-box; background:var(--bg); color:var(--text);
    border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:13px;
    line-height:1.55; font-family:inherit; resize:vertical; }
  .note-ta:focus { outline:none; border-color:var(--accent); }
  .note-actions { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .note-hint { color:var(--muted); font-size:11px; margin-right:auto; }
  .note-actions button { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:7px; padding:4px 12px; font-size:12px; cursor:pointer; }
  .note-actions .note-save { border-color:var(--accent); color:var(--accent); }
  .note-actions button:hover { border-color:var(--accent); }
  /* alarms / settings */
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; margin-bottom:20px; max-width:620px; }
  .panel h3 { margin:0 0 12px; font-size:15px; }
  .frow { display:flex; align-items:center; gap:10px; margin:8px 0; flex-wrap:wrap; }
  .frow label { color:var(--muted); font-size:13px; min-width:120px; }
  .frow input[type=text], .frow input[type=email], .frow input[type=password], .frow input[type=number] {
    flex:1 1 200px; background:var(--bg); color:var(--text); border:1px solid var(--line);
    border-radius:7px; padding:7px 10px; font-size:13px; }
  .frow input:focus { outline:none; border-color:var(--accent); }
  .btn { background:var(--accent); color:var(--accent-ink); border:0; border-radius:8px;
    padding:8px 16px; font-weight:600; cursor:pointer; font-size:13px; }
  .btn.ghost { background:var(--panel2); color:var(--text); border:1px solid var(--line); }
  .alarm-row { display:flex; align-items:center; gap:10px; padding:10px 12px;
    border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:var(--panel); }
  .alarm-row .kind { font-size:10px; text-transform:uppercase; letter-spacing:.4px;
    padding:2px 6px; border-radius:5px; background:var(--panel2); color:var(--muted); }
  .alarm-row .lbl { flex:1; font-weight:600; }
  .hint { color:var(--muted); font-size:12px; margin:4px 0 0; }
  .grid {
    display:grid; gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:13px 14px; display:flex; flex-direction:column; gap:10px;
  }
  .card.buyback { border-color:var(--buyback); }
  .who { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .who .nm { font-weight:600; display:block; }
  .who .role { color:var(--muted); font-size:12px; display:block; }
  .badge { font-size:10px; text-transform:uppercase; letter-spacing:.4px;
    padding:2px 6px; border-radius:5px; white-space:nowrap; }
  .badge.individual { background:var(--accent-dim); color:var(--accent); }
  .badge.institution { background:var(--inst-dim); color:var(--inst); }
  .badge.buyback { background:var(--buyback-dim); color:var(--buyback); }
  .bar { display:flex; height:8px; border-radius:5px; overflow:hidden; background:var(--panel2); }
  .bar .b { background:var(--buy); }
  .bar .s { background:var(--sell); }
  .counts { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { font-size:12px; padding:3px 8px; border-radius:6px; background:var(--panel2);
    border:1px solid var(--line); }
  .chip.buy { color:var(--buy); } .chip.sell { color:var(--sell); }
  .chip .n { font-weight:700; }
  .amounts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .amt { background:var(--panel2); border-radius:7px; padding:7px 9px; }
  .amt .lbl { font-size:11px; color:var(--muted); }
  .amt .val { font-size:14px; font-weight:600; }
  .amt.buy .val { color:var(--buy); } .amt.sell .val { color:var(--sell); }
  .amt .sh { font-size:11px; color:var(--muted); }
  .foot { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; }
  .empty { color:var(--muted); font-style:italic; padding:6px 0; }
  .nodata { text-align:center; color:var(--muted); padding:60px 20px; }
  /* per-company charts + transaction table */
  .charts { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .chart { flex:1 1 320px; min-width:280px; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:7px 10px 5px; }
  .chart-h { color:var(--muted); font-size:11px; margin-bottom:2px; }
  .svg-chart { width:100%; height:auto; display:block; }
  .svg-chart .axis { stroke:var(--line); stroke-width:1; }
  /* dots sit on the axis and overlap when trades cluster — translucent fill so
     a busy stretch reads as denser colour instead of one flat blob */
  .svg-chart circle { stroke:none; fill-opacity:.75; }
  .svg-chart circle.tl-buy { fill:var(--buy); }
  .svg-chart circle.tl-sell { fill:var(--sell); }
  .txn-table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  .txn-table { width:100%; border-collapse:collapse; font-size:13px; }
  .txn-table th, .txn-table td { padding:7px 10px; text-align:left; white-space:nowrap;
    border-bottom:1px solid var(--line); }
  .txn-table th { color:var(--muted); font-size:11px; font-weight:600; text-transform:uppercase;
    letter-spacing:.3px; background:var(--panel2); position:sticky; top:0; }
  .txn-table tbody tr:last-child td { border-bottom:0; }
  .txn-table tbody tr:hover { background:var(--panel); }
  .txn-table .t-num { text-align:right; font-variant-numeric:tabular-nums; }
  .txn-table .t-buy { color:var(--buy); }
  .txn-table .t-sell { color:var(--sell); }
  .txn-table .t-role, .txn-table .t-date { color:var(--muted); }
  .t-badge { font-size:9px; text-transform:uppercase; letter-spacing:.3px; margin-left:6px;
    padding:1px 5px; border-radius:4px; vertical-align:middle; }
  .t-badge.institution { background:var(--inst-dim); color:var(--inst); }
  .t-badge.buyback { background:var(--buyback-dim); color:var(--buyback); }
  /* add-company picker */
  .adder { position:relative; }
  .add-toggle { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:8px 16px; font-size:13px; cursor:pointer; }
  .add-toggle:hover { border-color:var(--accent); color:var(--accent); }
  .add-row { display:flex; gap:8px; flex:1; }
  .add-row.hidden { display:none; }
  .add-row input { flex:1 1 280px; }
  .add-row button { background:var(--accent); color:var(--accent-ink); border:0; border-radius:8px;
    padding:0 16px; font-weight:600; cursor:pointer; }
  .picker { position:absolute; z-index:10; top:calc(100% + 6px); left:0; right:0;
    background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    max-height:340px; overflow-y:auto; box-shadow:0 12px 30px var(--shadow); }
  .picker.hidden { display:none; }
  .cand { display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer;
    border-bottom:1px solid var(--line); }
  .cand:last-child { border-bottom:0; }
  .cand:hover { background:var(--hover); }
  .cand .nm { flex:1; }
  .cand .nm .sub { color:var(--muted); font-size:12px; }
  .cand .flag { font-size:11px; color:var(--muted); }
  .cand .tk { font-size:12px; color:var(--accent); background:var(--bg);
    border:1px solid var(--line); border-radius:6px; padding:2px 7px; white-space:nowrap; }
  .picker .msg { padding:10px 12px; color:var(--muted); font-size:13px; }
  .toast { position:fixed; bottom:54px; left:50%; transform:translateX(-50%);
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s;
    pointer-events:none; z-index:50; }
  .toast.show { opacity:1; }
  footer { flex:0 0 auto; padding:8px 20px; border-top:1px solid var(--line);
    background:var(--panel); color:var(--muted); font-size:11px; }
  /* ---- settings dialog ---- */
  .settings-cog { margin-left:auto; font-size:15px; line-height:1; padding:5px 10px; }
  .modal { position:fixed; inset:0; z-index:100; display:flex;
    align-items:center; justify-content:center; padding:24px;
    background:rgba(0,0,0,.55); }
  .modal.hidden { display:none; }
  .modal-card { background:var(--bg); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 18px 50px var(--shadow); width:min(760px,100%); max-height:100%;
    display:flex; flex-direction:column; overflow:hidden; }
  .modal-head { display:flex; align-items:center; gap:12px; padding:14px 18px;
    border-bottom:1px solid var(--line); background:var(--panel); flex:0 0 auto; }
  .modal-head h2 { margin:0; font-size:16px; }
  .modal-x { margin-left:auto; background:transparent; color:var(--muted);
    border:1px solid var(--line); border-radius:7px; padding:3px 10px;
    font-size:13px; cursor:pointer; }
  .modal-x:hover { border-color:var(--accent); color:var(--accent); }
  .modal-body { display:flex; min-height:0; flex:1 1 auto; }
  .settings-nav { flex:0 0 150px; border-right:1px solid var(--line);
    background:var(--panel); padding:10px 8px; display:flex; flex-direction:column; gap:2px; }
  .settings-nav button { background:transparent; border:0; border-radius:7px;
    color:var(--muted); text-align:left; padding:8px 12px; font-size:13px; cursor:pointer; }
  .settings-nav button:hover { color:var(--text); background:var(--panel2); }
  .settings-nav button.active { background:var(--panel2); color:var(--text); }
  .settings-pane { flex:1 1 auto; padding:18px; overflow-y:auto; min-width:0; }
  .settings-pane .panel { max-width:none; }
  .settings-pane h3:first-child { margin-top:0; }
  .settings-hint { color:var(--muted); font-size:12px; margin:0 0 14px; }
  /* theme picker */
  .shelf-h { margin:16px 0 8px; font-size:11px; text-transform:uppercase;
    letter-spacing:.6px; color:var(--muted); font-weight:600; }
  .shelf-note { text-transform:none; letter-spacing:0; font-weight:400;
    margin-left:8px; opacity:.8; }
  .follow-row { display:flex; align-items:flex-start; gap:10px; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; margin-bottom:16px; }
  .follow-row input { margin-top:2px; cursor:pointer; }
  .follow-row b { font-size:13px; display:block; }
  .follow-row .settings-hint { margin:2px 0 0; display:block; }
  .theme-grid { display:grid; gap:10px;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); }
  .theme-card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px; cursor:pointer; text-align:left; font:inherit; color:var(--text);
    display:flex; flex-direction:column; gap:8px; }
  .theme-card:hover { border-color:var(--accent); }
  .theme-card.active { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .theme-card .tname { font-weight:600; font-size:13px; display:flex;
    align-items:center; gap:6px; }
  .theme-card .tname .tick { margin-left:auto; color:var(--accent); }
  .theme-card .tdesc { color:var(--muted); font-size:11px; line-height:1.4; }
  /* a miniature of the app, painted with the theme's own variables */
  .swatch { border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .swatch .sw-bar { height:16px; display:flex; align-items:center; gap:4px; padding:0 6px; }
  .swatch .sw-body { height:26px; display:flex; align-items:center; gap:5px; padding:0 6px; }
  .swatch .dot { width:9px; height:9px; border-radius:50%; }
  .swatch .rule { height:4px; border-radius:2px; flex:1 1 auto; }
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <h1>InSight</h1>
    <span class="meta" id="datameta">loading…</span>
    <button id="refresh" class="refresh-btn">↻ Refresh data</button>
    <label class="disc" title="Also scrape MarketBeat's ~215 TSE companies (not just your watchlist). First run is slow (~15 min); later runs reuse the cache. Fills out the People tab.">
      <input type="checkbox" id="discover" /> Scan all TSE (~215)
    </label>
    <button id="sedi" class="refresh-btn" title="Fetch your watchlist from SEDI, Canada's official insider-filing system — the only source that covers small TSX-V names (e.g. WRLG). Opens a visible browser; solve the CAPTCHA once if prompted. Not for the daily timer.">⛏ Fetch from SEDI</button>
    <span class="meta" id="refreshmsg"></span>

      title="Settings — theme and notifications">⚙</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-view="companies" class="active">Companies</button>
    <button data-view="people">Insiders</button>
    <button data-view="alarms">Alarms</button>
    <button id="back" class="back-btn" disabled
      title="Go back to where you were (Alt+←)">← Back</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="s-cov">–</b><span id="l-cov">companies with activity</span></div>
    <div class="stat"><b id="s-txn">–</b><span id="l-txn">transactions</span></div>
    <div class="stat"><b id="s-co">–</b><span id="l-co">on watchlist</span></div>
  </div>
  <div class="controls">
    <input type="search" id="q" placeholder="Filter by company, ticker, or insider name…" />
    <div class="seg" id="filter">
      <button data-f="all" class="active">All</button>
      <button data-f="buy">Net buyers</button>
      <button data-f="sell">Net sellers</button>
      <button data-f="inst">Institutions</button>
    </div>
    <select id="range" title="Show transactions from this period">
      <option value="d7">Last week</option>
      <option value="d14" selected>Last 2 weeks</option>
      <option value="d21">Last 3 weeks</option>
      <option value="1">Last month</option>
      <option value="3">Last 3 months</option>
      <option value="6">Last 6 months</option>
      <option value="12">Last year</option>
      <option value="24">Last 2 years</option>
    </select>
  </div>
  <div class="controls adder">
    <button id="addtoggle" class="add-toggle">＋ Add company</button>
    <div class="add-row hidden" id="addrow">
      <input type="search" id="addq" placeholder="Add a company to the watchlist by name (e.g. New Found Gold)…"
             autocomplete="off" />
      <button id="addbtn">Search</button>
    </div>
    <div class="picker hidden" id="picker"></div>
  </div>
</header>

<main id="feed"><div class="nodata">Loading insider data…</div></main>

<footer id="foot"></footer>

<div class="modal hidden" id="settings">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-head">
      <h2 id="settings-title">Settings</h2>
      <button class="modal-x" id="settings-close" title="Close (Esc)">✕ Close</button>
    </div>
    <div class="modal-body">
      <nav class="settings-nav" id="settings-nav">
        <button data-page="theme" class="active">Appearance</button>
        <button data-page="notify">Notifications</button>
      </nav>
      <div class="settings-pane" id="settings-pane"></div>
    </div>
  </div>
</div>

<script>
const fmtMoney = (v, cur) => {
  if (!v) return (cur||"") + "0";
  const abs = Math.abs(v); let s;
  if (abs >= 1e9) s = (v/1e9).toFixed(2)+"B";
  else if (abs >= 1e6) s = (v/1e6).toFixed(2)+"M";
  else if (abs >= 1e3) s = (v/1e3).toFixed(1)+"K";
  else s = v.toFixed(0);
  return (cur ? cur+" " : "$") + s;
};
const fmtShares = n => !n ? "0" : n.toLocaleString();
const fmtPrice = (v, cur) => v == null ? "—" :
  (cur ? cur+" " : "$") + v.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:4});

let STATE = { view:"companies", data:null, people:null, q:"", qnorm:"", filter:"all", range:"d14",
              notify:null, alarmKeys:new Set(), alarmById:{}, sediPages:new Set(),
              // per-company notes: saved text, which editors are open, and any
              // unsaved draft (kept so a re-render — filter/search — never eats
              // what you were typing)
              notes:{}, notesOpen:new Set(), noteDraft:{},
              // back-stack of previous {view,q,filter,range}, plus the kind of
              // the last step (so typing bursts collapse) and any pending jump
              nav:[], navKind:null, jump:null,
              theme:document.documentElement.getAttribute("data-theme") || "dark",
              // mirrors settings.json; `theme` is the manual pick, auto_* are
              // the per-mode picks used when following the system
              themeCfg:{theme:"dark", auto:false, auto_dark:"dark", auto_light:"light"},
              settingsPage:"theme" };

// Alarm identity — must match notify.alarm_key on the backend.
const personKey = n => "person:" + (n||"").trim().toLowerCase().replace(/\s+/g," ");
const companyKey = (ex,tk) => "company:" + (ex||"").toUpperCase() + ":" + (tk||"").toUpperCase();
function bellBtn(type, d){
  const key = type === "person" ? personKey(d.name) : companyKey(d.exch, d.ticker);
  const on = STATE.alarmKeys.has(key);
  const attrs = type === "person"
    ? `data-atype="person" data-name="${esc(d.name)}"`
    : `data-atype="company" data-exch="${esc(d.exch)}" data-ticker="${esc(d.ticker)}"`;
  return `<button class="bell${on?' on':''}" ${attrs} data-label="${esc(d.label)}"
    title="${on?'Remove alarm — you are notified of new transactions':'Set an alarm for new transactions'}">🔔</button>`;
}

/* ---- per-company notes -------------------------------------------------- */
// Your own research, kept above the company's activity. Stored server-side as
// plain text (see insight/notes.py); the bullets are purely a UI convention —
// one "• " per line — so the note stays readable if ever opened by hand.
const BULLET = "• ";
const noteKey = (ex, tk) => `${(ex||"").toUpperCase()}:${(tk||"").toUpperCase()}`;

async function loadNotes(){
  try {
    const d = await (await fetch("/api/notes")).json();
    STATE.notes = d.notes || {};
  } catch(e){ STATE.notes = {}; }   // notes are optional — never block the feed
}

// Every non-blank line gets exactly one bullet, so pasted text and hand-typed
// text end up looking the same.
function bulletize(text){
  return (text||"").split("\n")
    .map(stripBullet)
    .filter(l => l !== "")
    .map(l => BULLET + l).join("\n");
}

// Drop indentation and any bullet marker the line already carries, so a line
// is never double-bulleted and pasted text lands flush.
const stripBullet = l => l.replace(/^\s*(?:[•\-*]\s*)?/, "").trim();

const noteLines = text => (text||"").split("\n").map(stripBullet).filter(Boolean);

function noteBtn(c){
  const k = noteKey(c.exchange, c.ticker);
  const has = !!STATE.notes[k], open = STATE.notesOpen.has(k);
  return `<button class="note-btn${has?' on':''}" data-nk="${esc(k)}"
    data-exch="${esc(c.exchange)}" data-ticker="${esc(c.ticker)}"
    title="${open ? 'Close the note' : (has ? 'Edit your note' : 'Add a note about this company')}">📝</button>`;
}

function renderNote(c){
  const k = noteKey(c.exchange, c.ticker);
  const saved = STATE.notes[k] || "";
  if (!STATE.notesOpen.has(k)){
    if (!saved) return "";
    return `<div class="note-bar"><ul class="note-view">${
      noteLines(saved).map(l => `<li>${esc(l)}</li>`).join("")}</ul></div>`;
  }
  const draft = STATE.noteDraft[k] !== undefined ? STATE.noteDraft[k] : (saved || BULLET);
  return `<div class="note-bar editing">
    <textarea class="note-ta" rows="4" data-nk="${esc(k)}"
      placeholder="What matters about this company…"
      aria-label="Note for ${esc(c.issuer_name)}">${esc(draft)}</textarea>
    <div class="note-actions">
      <span class="note-hint">Enter starts a new bullet · Ctrl+Enter saves</span>
      <button class="note-cancel" data-nk="${esc(k)}">Cancel</button>
      <button class="note-save" data-nk="${esc(k)}"
        data-exch="${esc(c.exchange)}" data-ticker="${esc(c.ticker)}">Save</button>
    </div>
  </div>`;
}

async function saveNote(ds){
  const k = ds.nk;
  const ta = document.querySelector(`.note-ta[data-nk="${CSS.escape(k)}"]`);
  const text = bulletize(ta ? ta.value : (STATE.noteDraft[k] || ""));
  try {
    const r = await fetch("/api/notes", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({exchange: ds.exch, ticker: ds.ticker, text})
    });
    const d = await r.json();
    if (!d.saved){ toast(d.msg || "Note not saved."); return; }
    if (text) STATE.notes[k] = text; else delete STATE.notes[k];
    delete STATE.noteDraft[k];
    STATE.notesOpen.delete(k);
    render();
  } catch(e){ toast("Note save failed: " + e.message); }
}

// Precompute a lowercased search string per company/box/person once when data
// loads, so filtering on each keystroke is a plain substring test (no per-item
// array-build/join/lowercase). This is the app's main hot path.
function indexCompanies(d){
  STATE.sediPages = new Set(d.sedi_pages || []);
  for (const c of d.companies || []){
    c._hay = (c.issuer_name + " " + c.exchange + ":" + c.ticker).toLowerCase();
    for (const t of c.transactions || [])
      t._hay = ((t.insider_name||"") + " " + (t.insider_role||"")).toLowerCase();
  }
}
function indexPeople(d){
  for (const p of d.people || []){
    const cos = (p.companies||[]).map(c => c.issuer_name+" "+c.ticker+" "+c.exchange).join(" ");
    p._hay = ((p.insider_name||"") + " " + (p.roles||[]).join(" ") + " " + cos).toLowerCase();
  }
}

function boxMatchesFilter(box){
  const f = STATE.filter;
  if (f === "all") return true;
  if (f === "inst") return box.entity_type === "institution" || box.is_issuer_buyback;
  if (f === "buy") return box.net_value > 0;
  if (f === "sell") return box.net_value < 0;
  return true;
}

// The segmented control filters the individual transaction rows shown for a
// company: buy/sell keep only that side, "inst" keeps institution/buyback rows.
function txnMatchesFilter(t){
  const f = STATE.filter;
  if (f === "all") return true;
  if (f === "inst") return t.entity_type === "institution" || t.is_issuer_buyback;
  if (f === "buy")  return t.side === "buy";
  if (f === "sell") return t.side === "sell";
  return true;
}

// Graph 1 — every buy/sell as a dot sitting ON a single date axis: a compact
// "note bar" rather than a lollipop chart. Position = when, colour = side,
// radius = share count (so magnitude survives losing the stems). Kept to one
// thin strip so a company card stays scannable at a glance.
function svgTimeline(txns){
  // No axis labels at all — the strip is a shape to glance at, and the table
  // below carries every exact date and share count. So the dots get the full
  // width, inset only enough that the widest one can't clip.
  const W = 600, H = 20, mid = H / 2, rMin = 1.6, rMax = 6, padX = rMax + 1;
  const times = txns.map(t => Date.parse(t.date));
  let minT = Math.min(...times), maxT = Math.max(...times);
  if (minT === maxT){ minT -= 864e5; maxT += 864e5; }   // single date → pad ±1d
  const maxSh = Math.max(...txns.map(t => t.shares||0)) || 1;
  // sqrt so a dot's *area* tracks share count — linear radius over-weights the
  // big trades and makes everything else vanish.
  const marks = txns.map(t => {
    const x = padX + (Date.parse(t.date)-minT)/(maxT-minT)*(W-padX*2);
    const r = rMin + Math.sqrt((t.shares||0)/maxSh) * (rMax - rMin);
    const cls = t.side === "buy" ? "buy" : "sell";
    return `<circle class="tl-${cls}" cx="${x.toFixed(1)}" cy="${mid}" r="${r.toFixed(1)}"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="svg-chart">
    <line class="axis" x1="0" y1="${mid}" x2="${W}" y2="${mid}"/>
    ${marks}
  </svg>`;
}

function renderCharts(rows){
  const bs = rows.filter(t => (t.side==="buy" || t.side==="sell") && t.date && (t.shares||0) > 0);
  if (!bs.length) return `<div class="empty">No dated buy/sell share activity to chart.</div>`;
  return `<div class="charts">
    <div class="chart">
      <div class="chart-h">Transactions over time — buys (green), sells (red) · dot size = shares</div>
      ${svgTimeline(bs)}
    </div>
  </div>`;
}

function renderTxnTable(rows){
  const body = rows.map(t => {
    const cur = t.currency || "";
    const sideCls = t.side === "buy" ? "t-buy" : t.side === "sell" ? "t-sell" : "";
    const kind = t.is_issuer_buyback ? "buyback"
      : (t.entity_type === "institution" ? "institution" : "");
    const badge = kind ? `<span class="t-badge ${kind}">${kind}</span>` : "";
    // A buyback's "insider" is the issuer itself, and the Insiders tab excludes
    // those by design — so it stays plain text rather than a link to nowhere.
    const who = t.is_issuer_buyback
      ? esc(t.insider_name)
      : `<button class="xnav" data-person="${esc(t.insider_name)}"
           title="See every company ${esc(t.insider_name)} traded">${esc(t.insider_name)}</button>`;
    return `<tr>
      <td class="t-date">${esc(t.date||"—")}</td>
      <td>${who}${badge}</td>
      <td class="t-role">${esc(t.insider_role||"—")}</td>
      <td class="${sideCls}">${esc(t.type||t.side)}</td>
      <td class="t-num">${fmtShares(t.shares)}</td>
      <td class="t-num">${fmtPrice(t.avg_price, cur)}</td>
      <td class="t-num ${sideCls}">${fmtMoney(t.total_value, cur)}</td>
    </tr>`;
  }).join("");
  return `<div class="txn-table-wrap"><table class="txn-table">
    <thead><tr>
      <th>Date</th><th>Insider</th><th>Role</th><th>Type</th>
      <th class="t-num">Shares</th><th class="t-num">Price</th><th class="t-num">Value</th>
    </tr></thead>
    <tbody>${body}</tbody>
  </table></div>`;
}

function renderCompany(c){
  const q = STATE.qnorm;
  const coMatch = !q || c._hay.includes(q);
  const all = c.transactions || [];
  const rows = all.filter(t => txnMatchesFilter(t) && (coMatch || t._hay.includes(q)));
  // if a query is set and neither the company nor any transaction matches, skip
  if (q && !coMatch && rows.length === 0) return "";
  const warn = c.confirmed === false
    ? `<span class="pill-warn">unverified ticker</span>` : "";
  let body;
  if (all.length === 0){
    body = `<div class="empty">No insider transactions found yet (source may not cover this issuer — see README).</div>`;
  } else if (rows.length === 0){
    body = `<div class="empty">No transactions match the current filter.</div>`;
  } else {
    body = renderCharts(rows) + renderTxnTable(rows);
  }
  const nIns = c.insider_count === 1 ? "1 insider" : `${c.insider_count} insiders`;
  const hasSedi = STATE.sediPages.has(`${c.exchange}:${c.ticker}`);
  const sediBtn = hasSedi
    ? `<a class="sedi-link" target="_blank" rel="noopener"
         href="/api/sedi-page?exchange=${encodeURIComponent(c.exchange)}&ticker=${encodeURIComponent(c.ticker)}"
         title="Open this company's official SEDI report (saved during the last SEDI fetch)">⛏ SEDI report</a>`
    : "";
  return `
  <section class="company">
    <div class="company-head">
      <span class="name">${esc(c.issuer_name)}</span>
      <span class="ticker">${esc(c.exchange)}:${esc(c.ticker)}</span>
      <span class="sub">${nIns} · ${c.txn_count} txns${c.latest_date? " · latest "+c.latest_date : ""}</span>
      ${warn}
      ${sediBtn}
      ${noteBtn(c)}
      ${bellBtn("company", {exch:c.exchange, ticker:c.ticker, label:c.issuer_name})}
      <button class="del-co" title="Remove from watchlist"
        data-exch="${esc(c.exchange)}" data-ticker="${esc(c.ticker)}" data-name="${esc(c.issuer_name)}">✕ Remove</button>
    </div>
    ${renderNote(c)}
    ${body}
  </section>`;
}

function setStats(a, la, b, lb, c, lc){
  document.getElementById("s-cov").textContent = a; document.getElementById("l-cov").textContent = la;
  document.getElementById("s-txn").textContent = b; document.getElementById("l-txn").textContent = lb;
  document.getElementById("s-co").textContent = c;  document.getElementById("l-co").textContent = lc;
}

function setMeta(d){
  document.getElementById("datameta").textContent =
    d.data_date ? `data as of ${d.data_date}` : "no data file yet — run a refresh";
  const hist = d.history_files > 1
    ? ` · merged ${d.history_files} daily snapshots (history accumulates as you refresh)` : "";
  document.getElementById("foot").textContent =
    `Source: ${d.data_file||"none"}${hist} · normalized insider transactions · reload after re-scraping to refresh.`;
}

function render(){
  if (STATE.view === "alarms") return renderAlarms();
  if (STATE.view === "people") return renderPeople();
  return renderCompanies();
}

function renderCompanies(){
  const d = STATE.data;
  if (!d){ return; }
  setStats(d.covered_companies, "companies with activity",
           d.total_transactions, "transactions",
           d.total_companies, "on watchlist");
  setMeta(d);
  const html = d.companies.map(renderCompany).join("");
  document.getElementById("feed").innerHTML =
    html.trim() ? html : `<div class="nodata">Nothing matches your filter.</div>`;
}

/* ---- People tab: same records, grouped by insider across companies ---- */
function personMatchesQuery(p){
  const q = STATE.qnorm;
  if (!q) return true;
  return p._hay.includes(q);
}

function renderPersonCompany(c){
  const total = (c.buy_value||0) + (c.sell_value||0);
  const buyPct = total ? (c.buy_value/total*100) : (c.buy_count? 100:0);
  const sellPct = total ? (c.sell_value/total*100) : (c.sell_count?100:0);
  const cur = c.currency || "";
  return `
  <div class="card">
    <div class="who">
      <button class="xnav xnav-co" data-exch="${esc(c.exchange)}" data-ticker="${esc(c.ticker)}"

/* ---- Alarms tab: notification settings + alarm list ---- */
async function loadAlarms(){
  try {
    STATE.notify = await (await fetch("/api/notify/config")).json();
  } catch(e){ STATE.notify = STATE.notify || {email:{},ntfy:{},alarms:[]}; }
  STATE.alarmKeys = new Set();
  STATE.alarmById = {};
  for (const a of (STATE.notify.alarms||[])){
    const k = a.type === "person" ? personKey(a.name) : companyKey(a.exchange, a.ticker);
    STATE.alarmKeys.add(k); STATE.alarmById[k] = a.id;
  }
}

async function toggleAlarm(ds){
  const key = ds.atype === "person" ? personKey(ds.name) : companyKey(ds.exch, ds.ticker);
  try {
    if (STATE.alarmKeys.has(key)){
      const id = STATE.alarmById[key];
      const d = await (await fetch("/api/alarms?id=" + encodeURIComponent(id), {method:"DELETE"})).json();
      toast(d.msg || "Alarm removed.");
    } else {
      const body = ds.atype === "person"
        ? {type:"person", name:ds.name, label:ds.label}
        : {type:"company", exchange:ds.exch, ticker:ds.ticker, label:ds.label};
      const d = await (await fetch("/api/alarms", {
        method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)})).json();
      toast(d.msg || (d.added ? "Alarm set." : "Not set."));
    }
    await loadAlarms(); render();
  } catch(e){ toast("Alarm failed: " + e.message); }
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,

/* ---- settings dialog ----------------------------------------------------- */
// One dialog, one page per concern. Appearance is instant and local;
// Notifications is the email/push setup that used to sit on the Alarms tab —
// it is configured once, so it belongs behind a settings door rather than in
// front of the list you actually check.

// `id` must match a [data-theme="id"] block in the stylesheet. DEFAULT_THEME is
// also what :root declares, so the page looks right before any JS runs.
const DEFAULT_THEME = "dark";
// `mode` only groups the picker — ten cards in one undifferentiated grid is a
// worse choice than two labelled shelves, and dark-vs-light is how people
// actually narrow it down.
const THEMES = [
  {id:"dark",      mode:"dark",  name:"Dark",      desc:"The original. Near-black, blue accent."},
  {id:"midnight",  mode:"dark",  name:"Midnight",  desc:"Navy rather than black — softer for late sessions."},
  {id:"terminal",  mode:"dark",  name:"Terminal",  desc:"Trading-desk phosphor: amber on black, monospaced.", icon:"▮"},
  {id:"caramel",   mode:"dark",  name:"Caramel",   desc:"Espresso and warm caramel, for when blue-greys feel cold.", icon:"☕"},
  {id:"chic",      mode:"dark",  name:"Chic",      desc:"Charcoal and champagne — understated, numbers do the talking.", icon:"✦"},
  {id:"light",     mode:"light", name:"Light",     desc:"Clean and bright for daytime reading."},
  {id:"newsprint", mode:"light", name:"Newsprint", desc:"Salmon paper and teal ink, like the financial press."},
  {id:"sage",      mode:"light", name:"Sage",      desc:"Soft green paper with a deep teal accent. Easy on the eyes.", icon:"🌿"},
  {id:"lemon",     mode:"light", name:"Lemon",     desc:"Lemon zest cut with teal. Bright without being loud.", icon:"🍋"},
  {id:"canadian",  mode:"light", name:"Canadian",  desc:"White and flag red, for the home market.", icon:"🍁"},
];
const themeIds = () => THEMES.map(t => t.id);
const isTheme = id => themeIds().includes(id);
const themeMode = id => (THEMES.find(t => t.id === id) || {}).mode;
const themesFor = mode => THEMES.filter(t => t.mode === mode);

const systemPrefersDark = () => {
  try { return matchMedia("(prefers-color-scheme: dark)").matches; }
  catch(e){ return false; }   // no matchMedia — behave as if the OS is light
};

// Which theme should actually be painted, given the stored preference. With
// `auto` on the OS chooses between the user's dark and light picks; otherwise
// it is simply the theme they selected.
function resolveTheme(cfg = STATE.themeCfg){
  const id = cfg.auto
    ? (systemPrefersDark() ? cfg.auto_dark : cfg.auto_light)
    : cfg.theme;
  return isTheme(id) ? id : DEFAULT_THEME;
}

// Paint immediately, then persist. The preference is mirrored into localStorage
// so the next load applies it before first paint (see the boot script in
// <head>); the server copy is the source of truth, so it survives a cleared
// cache and follows you to another browser.
function applyThemeCfg(patch, {persist = true} = {}){
  STATE.themeCfg = {...STATE.themeCfg, ...patch};
  const theme = resolveTheme();
  document.documentElement.setAttribute("data-theme", theme);
  STATE.theme = theme;
  try {
    localStorage.setItem("insight.theme.cfg", JSON.stringify(STATE.themeCfg));
  } catch(e){ /* private mode */ }
  if (persist){
    fetch("/api/settings", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(STATE.themeCfg)
    }).catch(() => toast("Theme applied, but could not be saved."));
  }
  if (!document.getElementById("settings").classList.contains("hidden")
      && STATE.settingsPage === "theme") renderSettings();
}

// Clicking a card means "use this" when following the system is off, and "use
// this for <shelf>" when it is on — which is why the shelves exist at all.
function pickTheme(id){
  if (!isTheme(id)) return;
  applyThemeCfg(STATE.themeCfg.auto
    ? (themeMode(id) === "dark" ? {auto_dark:id} : {auto_light:id})
    : {theme:id});
}

function setFollowSystem(on){
  applyThemeCfg({auto: !!on});
}

async function loadTheme(){
  try {
    const d = await (await fetch("/api/settings")).json();
    // Only take fields the server actually sent. Copying undefined over a good
    // local value would blank the preference on a partial or empty response —
    // and that value is what the boot script reads on the next load.
    const patch = {};
    for (const k of ["theme", "auto_dark", "auto_light"]) if (d[k]) patch[k] = d[k];
    if (typeof d.auto === "boolean") patch.auto = d.auto;
    applyThemeCfg(patch, {persist:false});
  } catch(e){ /* keep whatever localStorage already painted */ }
}

// Repaint when the OS flips between light and dark while the app is open.
//
// The MediaQueryList is held in a module-level binding on purpose: a browser is
// free to collect an unreferenced one, and the listener goes silent with it. An
// inline `matchMedia(...).addEventListener(...)` looks correct and stops working
// at an unpredictable point.
let SYSTEM_DARK_MQ = null;
function resyncSystemTheme(){
  if (STATE.themeCfg.auto && resolveTheme() !== STATE.theme) applyThemeCfg({}, {persist:false});
}
function watchSystemTheme(){
  try {
    SYSTEM_DARK_MQ = matchMedia("(prefers-color-scheme: dark)");
    SYSTEM_DARK_MQ.addEventListener("change", resyncSystemTheme);
  } catch(e){ /* older browser — the choice still applies on next load */ }
  // Belt and braces: not every environment delivers that change event (Chromium
  // under devtools colour-scheme emulation, for one), and an OS that switches on
  // a schedule usually does it while the app is in the background. Re-checking
  // when the tab becomes visible catches up either way, and costs one comparison.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) resyncSystemTheme();
  });
}

// With auto on, each shelf marks its own pick — two ticks, one per mode — and
// the one the OS is currently using is called out so the page you're looking at
// is never a mystery.
function isChosen(t){
  const cfg = STATE.themeCfg;
  if (!cfg.auto) return cfg.theme === t.id;
  return t.mode === "dark" ? cfg.auto_dark === t.id : cfg.auto_light === t.id;
}

function themeCard(t){
  const on = isChosen(t);
  const live = on && STATE.themeCfg.auto && STATE.theme === t.id;
  // The swatch is painted with the theme's OWN variables via data-theme on the
  // preview itself, so it can never drift from the real palette.
  return `
    <button class="theme-card${on?" active":""}" data-theme-id="${esc(t.id)}"
      aria-pressed="${on}" title="${STATE.themeCfg.auto
        ? `Use ${esc(t.name)} when your system is ${t.mode}`
        : `Use the ${esc(t.name)} theme`}">
      <span class="tname">${t.icon ? esc(t.icon)+" " : ""}${esc(t.name)}
        <span class="tick">${live ? "● now" : (on ? "✓" : "")}</span></span>
      <span class="swatch" data-theme="${esc(t.id)}" style="background:var(--bg)">
        <span class="sw-bar" style="background:var(--panel)">
          <span class="dot" style="background:var(--accent)"></span>
          <span class="rule" style="background:var(--line)"></span>
        </span>
        <span class="sw-body">
          <span class="dot" style="background:var(--buy)"></span>
          <span class="dot" style="background:var(--sell)"></span>
          <span class="dot" style="background:var(--inst)"></span>
          <span class="rule" style="background:var(--panel2)"></span>
        </span>
      </span>
      <span class="tdesc">${esc(t.desc)}</span>
    </button>`;
}

function themeShelf(mode, title){
  const auto = STATE.themeCfg.auto;
  const note = auto
    ? `<span class="shelf-note">used when your system is ${mode}</span>`
    : "";
  return `<h4 class="shelf-h">${title}${note}</h4>
    <div class="theme-grid">${themesFor(mode).map(themeCard).join("")}</div>`;
}

function themePage(){
  const auto = STATE.themeCfg.auto;
  return `
    <label class="follow-row">
      <input type="checkbox" id="follow-system" ${auto ? "checked" : ""}>
      <span>
        <b>Match my system</b>
        <span class="settings-hint">${auto
          ? "Switching automatically — right now your system is <b>"
            + (systemPrefersDark() ? "dark" : "light")
            + "</b>. Pick the theme to use for each below."
          : "Follow the light/dark setting of your operating system."}</span>
      </span>
    </label>
    ${themeShelf("dark", "Dark")}
    ${themeShelf("light", "Light")}`;
}

// Same field ids the old Alarms-tab form used, so collectNotifySettings and
// saveNotifySettings keep working unchanged — only the location moved.
function notifyPage(){

}

function renderSettings(){

}

function openSettings(page){

  document.getElementById("settings-close").focus();
}

function closeSettings(){
  document.getElementById("settings").classList.add("hidden");
  // The alarm list shows whether a delivery channel is on, so it may be stale
  // after a visit to the Notifications page.

}

async function load(){
  if (STATE.view === "alarms"){ await loadAlarms(); render(); return; }
  try {
    const url = STATE.view === "people" ? "/api/people" : "/api/data";
    // Range token is "dN" for a week/day window, else a plain month count.
    const qp = STATE.range[0] === "d"
      ? "days=" + STATE.range.slice(1)
      : "months=" + STATE.range;
    const r = await fetch(url + "?" + qp);
    const d = await r.json();
    if (STATE.view === "people"){ indexPeople(d); STATE.people = d; }
    else { indexCompanies(d); STATE.data = d; }
    render();
    reportJump();
  } catch(e){
    document.getElementById("feed").innerHTML =
      `<div class="nodata">Failed to load data: ${esc(e.message)}</div>`;
  }
}

/* ---- cross-navigation + a short back-stack ------------------------------- */
// The two tabs are the same trades sliced differently, so following a name from
// one to the other is the natural move: an insider's company card opens that
// company, a company's transaction row opens that insider. Each jump just sets
// the tab + search box — no new endpoint, and the target is filtered to exactly
// what you clicked.
const NAV_MAX = 10;

const navSnapshot = () =>
  ({view:STATE.view, q:STATE.q, filter:STATE.filter, range:STATE.range});
const sameNav = (a, b) =>
  a.view === b.view && a.q === b.q && a.filter === b.filter && a.range === b.range;
const sameButQuery = (a, b) =>
  a.view === b.view && a.filter === b.filter && a.range === b.range;

// Called *before* a state change, so it records where you're leaving from.
function pushNav(kind){
  const snap = navSnapshot();
  const last = STATE.nav[STATE.nav.length - 1];
  if (last && sameNav(last, snap)){ STATE.navKind = kind; return; }
  // A burst of typing is one step, not one per keystroke — otherwise a search
  // would flush the whole stack before you could go back anywhere useful.
  if (kind === "search" && STATE.navKind === "search" && last && sameButQuery(last, snap)){
    return;
  }
  STATE.nav.push(snap);
  if (STATE.nav.length > NAV_MAX) STATE.nav.shift();   // keep the newest NAV_MAX
  STATE.navKind = kind;
  syncBackBtn();
}

function syncBackBtn(){
  const b = document.getElementById("back");
  b.disabled = STATE.nav.length === 0;
  b.textContent = STATE.nav.length ? `← Back (${STATE.nav.length})` : "← Back";
}

// Push the DOM controls back into agreement with STATE after a jump or a back.
function syncControls(){
  document.querySelectorAll("#tabs button[data-view]").forEach(x =>
    x.classList.toggle("active", x.dataset.view === STATE.view));
  document.querySelectorAll("#filter button").forEach(x =>
    x.classList.toggle("active", x.dataset.f === STATE.filter));
  document.getElementById("q").value = STATE.q;
  document.getElementById("range").value = STATE.range;
  applyViewChrome();
}

function setQuery(q){ STATE.q = q; STATE.qnorm = q.trim().toLowerCase(); }

function goToCompany(exch, ticker, name){
  pushNav("jump");
  STATE.view = "companies";
  setQuery(`${exch}:${ticker}`);
  STATE.filter = "all";           // a stale buy/sell filter could hide the target
  STATE.jump = {kind:"company", key:`${exch}:${ticker}`.toUpperCase(), label:name};
  syncControls();
  load();
}

function goToPerson(name){
  pushNav("jump");
  STATE.view = "people";
  setQuery(name);
  STATE.filter = "all";
  STATE.jump = {kind:"person", label:name};
  syncControls();
  load();
}

// The Companies tab is watchlist-gated while the Insiders tab spans everything
// scraped, so a jump can legitimately land on nothing. Say why instead of
// showing an empty feed.
function reportJump(){
  const j = STATE.jump;
  if (!j) return;
  STATE.jump = null;
  if (j.kind === "company"){
    const found = (STATE.data?.companies || []).some(
      c => `${c.exchange}:${c.ticker}`.toUpperCase() === j.key);
    if (!found) toast(`${j.label} isn't on your watchlist — add it to open its page.`);
  } else {
    const want = j.label.trim().toLowerCase();
    const found = (STATE.people?.people || []).some(
      p => (p.insider_name||"").trim().toLowerCase() === want);
    if (!found) toast(`No trades by ${j.label} in this period — try a wider time range.`);
  }
}

async function goBack(){
  if (!STATE.nav.length) return;
  const snap = STATE.nav.pop();
  STATE.navKind = "back";
  STATE.view = snap.view;
  setQuery(snap.q);
  STATE.filter = snap.filter;
  STATE.range = snap.range;
  syncControls();
  syncBackBtn();
  await load();
}

/* ---- add-company-by-name flow with disambiguation picker ---- */
const flag = cc => ({CA:"🇨🇦",US:"🇺🇸",GB:"🇬🇧",DE:"🇩🇪",HK:"🇭🇰",AU:"🇦🇺"}[cc]||cc||"");
const picker = document.getElementById("picker");
const addq = document.getElementById("addq");
const addToggle = document.getElementById("addtoggle");
const addRow = document.getElementById("addrow");
let searchTimer = null, lastQuery = "";

function hidePicker(){ picker.classList.add("hidden"); picker.innerHTML = ""; }
function showPicker(html){ picker.innerHTML = html; picker.classList.remove("hidden"); }

// The add-company search box is revealed on demand (via the "＋ Add company"
// button) so it doesn't sit next to the filter box; it collapses again once a
// company is picked, the user clicks away, or Escape is pressed.
function showAdder(){
  addRow.classList.remove("hidden");
  addToggle.style.display = "none";
  addq.focus();
}
function hideAdder(){
  hidePicker();
  addRow.classList.add("hidden");
  addToggle.style.display = "";
  addq.value = ""; lastQuery = "";
}

function toast(msg){
  let t = document.getElementById("toast");
  if (!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2600);
}

async function runSearch(){
  const q = addq.value.trim();
  lastQuery = q;
  if (q.length < 2){ hidePicker(); return; }
  showPicker(`<div class="msg">Searching “${esc(q)}”…</div>`);
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(q));
    const d = await r.json();
    if (q !== lastQuery) return;           // a newer query superseded this one
    const cands = d.candidates || [];
    if (!cands.length){ showPicker(`<div class="msg">No matching issuers found.</div>`); return; }
    showPicker(cands.map((c,i) => `
      <div class="cand" data-i="${i}">
        <span class="flag">${flag(c.country)}</span>
        <div class="nm">
          <div>${esc(c.legal_name)}</div>
          <div class="sub">${esc(c.exchange_raw||c.exchange)} · ${esc(c.country)}</div>
        </div>
        <span class="tk">${esc(c.exchange)}:${esc(c.ticker)}</span>
      </div>`).join(""));
    picker._cands = cands;
  } catch(e){
    showPicker(`<div class="msg">Search failed: ${esc(e.message)}</div>`);
  }
}

async function addCandidate(c){
  hideAdder();
  try {
    const r = await fetch("/api/watchlist", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(c),
    });
    const d = await r.json();
    toast(d.msg || (d.added ? "Added." : "Not added."));
    if (d.added) await load();
  } catch(e){ toast("Add failed: " + e.message); }
}

async function removeCompany(exchange, ticker, name){
  const label = `${name} (${exchange}:${ticker})`;
  if (!confirm(`Remove ${label} from the watchlist?`)) return;
  try {
    const r = await fetch(
      "/api/watchlist?exchange=" + encodeURIComponent(exchange) + "&ticker=" + encodeURIComponent(ticker),
      { method:"DELETE" });
    const d = await r.json();
    toast(d.msg || (d.removed ? "Removed." : "Not removed."));
    if (d.removed) await load();
  } catch(e){ toast("Remove failed: " + e.message); }
}

const feed = document.getElementById("feed");

feed.addEventListener("click", e => {
  const bell = e.target.closest(".bell");
  if (bell){ toggleAlarm(bell.dataset); return; }
  const xnav = e.target.closest(".xnav");
  if (xnav){
    if (xnav.dataset.person) goToPerson(xnav.dataset.person);
    else goToCompany(xnav.dataset.exch, xnav.dataset.ticker, xnav.dataset.name);
    return;
  }
  const note = e.target.closest(".note-btn");
  if (note){
    const k = note.dataset.nk;
    if (STATE.notesOpen.has(k)){ STATE.notesOpen.delete(k); delete STATE.noteDraft[k]; }
    else STATE.notesOpen.add(k);
    render();
    // focus the editor and park the caret at the end of the last bullet
    const ta = document.querySelector(`.note-ta[data-nk="${CSS.escape(k)}"]`);
    if (ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    return;
  }
  const save = e.target.closest(".note-save");
  if (save){ saveNote(save.dataset); return; }
  const cancel = e.target.closest(".note-cancel");
  if (cancel){
    STATE.notesOpen.delete(cancel.dataset.nk);
    delete STATE.noteDraft[cancel.dataset.nk];
    render();
    return;
  }
  const btn = e.target.closest(".del-co");
  if (btn && btn.dataset.ticker && !btn.classList.contains("del-alarm"))
    removeCompany(btn.dataset.exch, btn.dataset.ticker, btn.dataset.name);
});

// Notes are a bullet list by default: Enter opens the next bullet, and
// backspacing into an empty bullet removes it rather than stranding a "• ".
feed.addEventListener("keydown", e => {
  const ta = e.target.closest(".note-ta");
  if (!ta) return;
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){
    e.preventDefault();
    const btn = ta.parentElement.querySelector(".note-save");
    if (btn) saveNote(btn.dataset);
    return;
  }
  if (e.key === "Enter"){
    e.preventDefault();
    const s = ta.selectionStart, t = ta.value;
    ta.value = t.slice(0, s) + "\n" + BULLET + t.slice(ta.selectionEnd);
    ta.setSelectionRange(s + 1 + BULLET.length, s + 1 + BULLET.length);
    STATE.noteDraft[ta.dataset.nk] = ta.value;
    return;
  }
  if (e.key === "Escape"){
    STATE.notesOpen.delete(ta.dataset.nk);
    delete STATE.noteDraft[ta.dataset.nk];
    render();
    return;
  }
  if (e.key === "Backspace" && ta.selectionStart === ta.selectionEnd){
    const s = ta.selectionStart, t = ta.value;
    const lineStart = t.lastIndexOf("\n", s - 1) + 1;
    // caret sits just past a bullet marker with nothing typed after it
    if (s === lineStart + BULLET.length && t.slice(lineStart, s) === BULLET){
      e.preventDefault();
      const cut = lineStart === 0 ? 0 : lineStart - 1;   // also eat the newline
      ta.value = t.slice(0, cut) + t.slice(s);
      ta.setSelectionRange(cut, cut);
      STATE.noteDraft[ta.dataset.nk] = ta.value;
    }
  }
});

feed.addEventListener("input", e => {
  const ta = e.target.closest(".note-ta");
  if (!ta) return;
  // an emptied box still offers a bullet to type on
  if (ta.value === "") ta.value = BULLET;
  STATE.noteDraft[ta.dataset.nk] = ta.value;
});

addToggle.addEventListener("click", showAdder);
addq.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 280);
});
addq.addEventListener("keydown", e => {
  if (e.key === "Enter"){ clearTimeout(searchTimer); runSearch(); }
  if (e.key === "Escape"){ clearTimeout(searchTimer); hideAdder(); }
});
document.getElementById("addbtn").addEventListener("click", () => { clearTimeout(searchTimer); runSearch(); });
picker.addEventListener("click", e => {
  const row = e.target.closest(".cand");
  if (row && picker._cands) addCandidate(picker._cands[+row.dataset.i]);
});
document.addEventListener("click", e => {
  if (!e.target.closest(".adder")) hideAdder();
});

/* ---- refresh (re-scrape) with status polling ---- */
const refreshBtn = document.getElementById("refresh");
const sediBtn = document.getElementById("sedi");
const refreshMsg = document.getElementById("refreshmsg");
let pollTimer = null;

function setRefreshing(on, msg){
  refreshBtn.disabled = on;                    // both buttons share one job slot
  sediBtn.disabled = on;
  refreshBtn.textContent = on ? "↻ Refreshing…" : "↻ Refresh data";
  refreshMsg.textContent = msg || "";
}

async function pollRefresh(){
  try {
    const d = await (await fetch("/api/refresh/status")).json();
    refreshMsg.textContent = d.message || "";
    if (d.running){ return; }                 // keep polling
    clearInterval(pollTimer); pollTimer = null;
    setRefreshing(false, d.message);
    if (d.ok) await load();                    // show freshly scraped data
    setTimeout(()=>{ refreshMsg.textContent = ""; }, 6000);
  } catch(e){
    clearInterval(pollTimer); pollTimer = null;
    setRefreshing(false, "status check failed: " + e.message);
  }
}

async function startRefresh(url, startMsg){
  setRefreshing(true, startMsg);
  try {
    const r = await fetch(url, { method:"POST" });
    if (r.status === 409){ setRefreshing(true, "A refresh is already running…"); }
    if (!pollTimer) pollTimer = setInterval(pollRefresh, 1500);
  } catch(e){ setRefreshing(false, "Could not start: " + e.message); }
}

refreshBtn.addEventListener("click", () => {
  if (refreshBtn.disabled) return;
  const discover = document.getElementById("discover").checked;
  startRefresh("/api/refresh" + (discover ? "?discover=1" : ""),
    discover ? "Starting… (scanning ~215 companies, this can take a while)" : "Starting…");
});

sediBtn.addEventListener("click", () => {
  if (sediBtn.disabled) return;
  startRefresh("/api/refresh?source=sedi",
    "Starting SEDI… a browser window will open — solve the CAPTCHA there if prompted.");
});

let qTimer = null;
document.getElementById("q").addEventListener("input", e => {
  pushNav("search");               // records the query you're leaving, not each letter
  STATE.q = e.target.value;
  STATE.qnorm = STATE.q.trim().toLowerCase();
  clearTimeout(qTimer);            // debounce so huge lists don't re-render per keystroke
  qTimer = setTimeout(render, 90);
});
document.getElementById("range").addEventListener("change", e => {
  pushNav("range");
  STATE.range = e.target.value; load();
});
document.querySelectorAll("#filter button").forEach(b => {
  b.addEventListener("click", () => {
    if (b.classList.contains("active")) return;
    pushNav("filter");
    document.querySelectorAll("#filter button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    STATE.filter = b.dataset.f; render();
  });
});
// [data-view] so the Back button sharing this row isn't mistaken for a tab.
document.querySelectorAll("#tabs button[data-view]").forEach(b => {
  b.addEventListener("click", () => {
    if (b.classList.contains("active")) return;
    pushNav("tab");
    document.querySelectorAll("#tabs button[data-view]").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    STATE.view = b.dataset.view;
    applyViewChrome();
    document.getElementById("feed").innerHTML = `<div class="nodata">Loading…</div>`;
    load();
  });
});

document.getElementById("back").addEventListener("click", goBack);

/* ---- settings dialog wiring ---- */
document.getElementById("settings-open").addEventListener("click", () => openSettings());
document.getElementById("settings-close").addEventListener("click", closeSettings);
document.getElementById("settings-nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-page]");
  if (!b) return;
  STATE.settingsPage = b.dataset.page;
  renderSettings();
});
document.getElementById("settings-pane").addEventListener("click", e => {
  const card = e.target.closest(".theme-card");
  if (card) pickTheme(card.dataset.themeId);
});
document.getElementById("settings-pane").addEventListener("change", e => {
  if (e.target.id === "follow-system") setFollowSystem(e.target.checked);
});
// Clicking the backdrop (but not the card) closes, like any modal.
document.getElementById("settings").addEventListener("click", e => {
  if (e.target.id === "settings") closeSettings();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.getElementById("settings").classList.contains("hidden")){
    closeSettings();
    return;
  }
  // Alt+← matches the browser's own back gesture; the app owns it because the
  // page never navigates, so the browser's history is empty.
  if (e.altKey && e.key === "ArrowLeft"){ e.preventDefault(); goBack(); }
});

// The search/filter/add-company controls only apply to the data tabs; hide them
// on the Alarms tab, which has its own settings form.
function applyViewChrome(){
  const isAlarms = STATE.view === "alarms";
  hideAdder();
  document.querySelectorAll("header .controls").forEach(el => { el.style.display = isAlarms ? "none" : ""; });
  document.getElementById("q").placeholder = STATE.view === "people"
    ? "Filter by insider name, company, or ticker…"
    : "Filter by company, ticker, or insider name…";
  syncBackBtn();
}

// Alarms and notes first, so the 🔔 and 📝 buttons render their state on the
// very first paint instead of flipping on a second pass.
watchSystemTheme();
Promise.all([loadAlarms(), loadNotes(), loadTheme()]).then(load);
</script>

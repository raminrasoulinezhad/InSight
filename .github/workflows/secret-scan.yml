name: Secret scan

# Server-side backstop for the local gitleaks pre-commit hook: anyone can skip a
# local hook (`git commit --no-verify`, or not installing pre-commit at all), so
# this re-scans on every push and pull request and fails the build on a hit.
# Scans the FULL git history (fetch-depth: 0), not just the latest diff.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so old commits are scanned too

      - name: Install gitleaks
        run: |
          version="8.21.2"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL "$url" | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

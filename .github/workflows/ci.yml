name: CI

# Lint, type-check, and test on every push and pull request. Mirrors the local
# dev tooling (ruff / mypy / pytest) so CI fails the same way a developer would
# locally. Tests are pure (no network/browser), so no Playwright install needed.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python + sync dev deps
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check insight tests

      - name: Ruff format check
        run: uv run ruff format --check insight tests

      - name: Type check (mypy)
        run: uv run mypy insight

      - name: Tests
        run: uv run pytest

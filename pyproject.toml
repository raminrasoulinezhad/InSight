[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insight"
version = "0.1.0"
description = "View and collect insider stock transactions for a watchlist (Canada/US)."
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{ name = "Seyedramin Rasoulinezhad" }]
dependencies = [
    "playwright==1.60.0",
    "playwright-stealth==2.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
insight = "insight.app:main"
insight-scrape = "insight.scrape:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["insight"]
# Ship the UI and the default watchlist as package data so the installed app
# works with the source repo deleted.
artifacts = [
    "insight/webui/*",
    "insight/companies.default.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "insight",
    "README.md",
    "DEVELOPER_README.md",
    "REPORT.md",
    "assets",
    "install-desktop.sh",
    "insight.desktop",
]
